# Security and code-quality scanning. Setup: docs/SECURITY_SCAN.md (ADR 0012).
name: Security scan

on:
  push:
    branches: [main, online-rooms]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # SonarQube Cloud PR decoration reads PR metadata

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    # PRs from forks get no secrets; skip instead of failing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for blame, new-code detection and PR analysis
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage (lcov for SonarQube)
        run: npm run test:coverage
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  npm-audit:
    name: npm audit (high+, report only)
    runs-on: ubuntu-latest
    # Blocking: `npm audit --audit-level=high` is clean (package.json overrides pin patched sharp and
    # miniflare's undici). Any new high advisory fails this job. See ADR 0012.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (incl. dev tooling)
        if: always()
        run: npm audit --audit-level=high
