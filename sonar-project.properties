# SonarQube Cloud (https://sonarcloud.io). projectKey and organization MUST match the project you
# import in SonarQube Cloud; change them here if yours differ. Setup: docs/SECURITY_SCAN.md.
sonar.projectKey=DhanushPrince_Mafia
sonar.organization=dhanushprince
sonar.projectName=Mafia Dealer

sonar.sources=src,worker
sonar.tests=src,worker
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-ssr/**,e2e/**,public/**,src/audio/**/*.json,coverage/**,**/*.test.js,**/*.test.jsx,**/*.spec.js
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,e2e/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
